<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pssycco — tu contrato</title>
<style>
  :root{
    --bg:#f4f2ec; --ink:#4b4d45; --deep:#33352f; --muted:#9a9d90; --line:rgba(51,53,47,0.12);
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
    /* the contract's own palette (from the IngeAr document) */
    --doc-text:#6e6e6e; --doc-head:#808080; --doc-rule:#1f3a5c; --doc-navy:#1b3456; --doc-stripe:#edf1f5; --doc-faint:#c4c4c4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg);}
  body{font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- screen: the form ---------- */
  .ui{max-width:1080px; margin:0 auto; padding:28px 5% 10px;}
  .ui-top{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:40px;}
  .ui-top a{font-size:12.5px; color:var(--muted); text-decoration:none; letter-spacing:0.04em;}
  .ui-top a:hover{color:var(--ink);}
  .ui-top img{height:20px;}
  .ui h1{font-size:clamp(34px,5vw,54px); font-weight:400; letter-spacing:-0.02em; text-transform:lowercase;}
  .ui .lead{font-size:16px; line-height:1.7; color:var(--ink); max-width:620px; margin:16px 0 34px;}
  form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 20px;}
  .f{display:flex; flex-direction:column; gap:7px;}
  .f.full{grid-column:1/-1;}
  .f label{font-size:12px; color:var(--muted); letter-spacing:0.02em;}
  .f input,.f select{
    width:100%; padding:13px 14px; border:1px solid var(--line); background:#faf9f5; color:var(--ink);
    font-family:var(--sans); font-size:15px; border-radius:10px; outline:none;
  }
  .f input:focus,.f select:focus{border-color:var(--ink);}
  .seg{display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:12px; background:rgba(51,53,47,0.04);}
  .seg button{flex:1; border:none; background:transparent; padding:10px; border-radius:9px; font-size:13.5px; color:var(--muted); font-family:var(--sans); cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg);}
  .actions{grid-column:1/-1; display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:10px;}
  .actions button.dl{
    background:var(--ink); color:var(--bg); border:none; padding:16px 28px; border-radius:26px; cursor:pointer;
    font-size:14px; letter-spacing:0.04em; text-transform:lowercase; font-family:var(--sans);
  }
  .actions button.dl:hover{background:var(--deep);}
  .actions small{font-size:12.5px; color:var(--muted); line-height:1.6; max-width:420px;}
  .empty{padding:60px 0; font-size:16px; color:var(--muted);}
  .empty a{color:var(--ink);}
  @media (max-width:700px){ form{grid-template-columns:1fr;} .ui{padding:20px 16px 10px;} }
  .preview-label{max-width:1080px; margin:60px auto 18px; padding:0 5%; font-size:12px; color:var(--muted); letter-spacing:0.04em;}

  /* ---------- the document ---------- */
  .doc{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:var(--doc-text); font-size:10.6pt; line-height:1.42;}
  .doc b,.doc strong{font-weight:700; color:#6a6a6a;}
  .doc p{margin:0 0 11pt; text-align:justify; hyphens:manual;}
  .doc h2{
    font-size:11.2pt; font-weight:700; color:var(--doc-head); text-transform:uppercase; letter-spacing:0;
    border-bottom:0.9pt solid var(--doc-rule); padding-bottom:2pt; margin:20pt 0 10pt; break-after:avoid;
  }
  .doc ol{margin:0 0 11pt 22pt;}
  .doc ol li{margin:0 0 5pt; text-align:justify; padding-left:4pt;}
  .doc .sub{margin-left:38pt;}
  .doc .sub p{margin-bottom:9pt;}
  .doc table.t{width:100%; border-collapse:collapse; margin:6pt 0 14pt; font-size:10.2pt; break-inside:avoid;}
  .doc table.t th{background:var(--doc-navy); color:#a9b0ba; font-weight:700; padding:6pt 8pt; border:0.8pt solid #222; text-align:center;}
  .doc table.t td{padding:5pt 8pt; border:0.8pt solid #222; color:var(--doc-text); text-align:center;}
  .doc table.t td:first-child{text-align:left;}
  .doc table.t tr:nth-child(even) td{background:var(--doc-stripe);}
  .doc table.t tr.sum td{font-weight:700; color:#5d5d5d;}
  .doc table.t td.r{text-align:right;}
  .sign{display:grid; grid-template-columns:1fr 1fr; gap:60pt; margin-top:110pt; text-align:center; break-inside:avoid;}
  .sign div{border-top:0.8pt solid var(--doc-faint); padding-top:8pt; font-size:9.6pt; line-height:1.45;}
  .sign b{display:block; color:#6a6a6a;}

  .page-hd{display:flex; justify-content:space-between; align-items:flex-start; height:0.9in; padding:0.42in 0 0;}
  .page-hd .glyphs{display:flex; gap:10pt; color:#b3b3b3;}
  .page-hd .glyphs svg{width:13pt; height:13pt; fill:currentColor;}
  .page-hd .tier{font-size:9pt; color:#c3c3c3; margin-top:-6pt;}
  .page-hd .tier b{color:#b5b5b5;}
  .page-ft{height:0.75in; text-align:center; font-size:8pt; color:#d0d0d0; padding-top:0.25in;}
  .page-ft b{color:#c4c4c4;}

  .cover,.backpage{display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; background:#fff;}
  .cover img{width:3.9in; height:auto; margin-top:1.5in;}
  .cover .ctitle{margin-top:0.9in; font-size:9.4pt; color:#8c8c8c; letter-spacing:0.01em;}
  .cover .ctitle b{color:#7a7a7a;}
  .cover .cfoot,.backpage .bfoot{position:absolute; left:0; right:0; text-align:center; font-size:8.6pt; color:#cdcdcd;}
  .cover .cfoot{bottom:1.15in;}
  .cover .cfoot b,.backpage .bfoot b{color:#bdbdbd;}
  .backpage .bmark{display:flex; flex-direction:column; align-items:center; gap:10pt; padding:24pt 40pt; background:#fbfbfb;}
  .backpage .bmark .glyphs{display:flex; gap:14pt; color:#a9a9a9;}
  .backpage .bmark .glyphs svg{width:17pt; height:17pt; fill:currentColor;}
  .backpage .bmark span{font-size:10pt; color:#a9a9a9;}
  .backpage .bfoot{bottom:1.05in; font-size:8.2pt;}

  /* screen: show the document as letter sheets */
  @media screen{
    .sheets{max-width:8.5in; margin:0 auto 80px; padding:0 12px;}
    .sheet{background:#fff; box-shadow:0 30px 60px -30px rgba(51,53,47,0.35), 0 1px 3px rgba(0,0,0,0.06); margin:0 auto 26px; width:100%;}
    .cover,.backpage{aspect-ratio:8.5/11;}
    .body-sheet{padding:0 0.95in 0.4in;}
    .body-sheet .page-ft{display:none;}
    .print-only{display:none;}
    @media (max-width:720px){
      .doc{font-size:9.6pt;} .body-sheet{padding:0 22px 20px;}
      .cover img{width:58%; margin-top:0;} .cover .ctitle{margin-top:12%; font-size:8.6pt;} .cover .cfoot{bottom:7%; font-size:7.6pt;} .backpage .bfoot{bottom:7%;} .sign{gap:20pt; margin-top:60pt;}
    }
  }

  /* print: real letter pages, header & footer repeat on every page */
  @page{size:letter; margin:0;}
  @media print{
    html,body{background:#fff;}
    .ui,.preview-label{display:none !important;}
    .sheets{margin:0; padding:0;}
    .sheet{box-shadow:none; margin:0;}
    .cover,.backpage{width:8.5in; height:11in; break-after:page; z-index:5;}
    .backpage{break-before:page; break-after:auto;}
    .cover .cfoot{bottom:1.15in;}
    .screen-only{display:none;}
    table.frame{width:100%; border-collapse:collapse;}
    table.frame > thead > tr > td, table.frame > tfoot > tr > td{padding:0;}
    table.frame > tbody > tr > td{padding:0 0.95in;}
    .fixed-hd{position:fixed; top:0; left:0.95in; right:0.95in;}
    .fixed-ft{position:fixed; bottom:0; left:0; right:0;}
    .spacer-hd{height:1.15in;} .spacer-ft{height:0.8in;}
    .doc h2{break-after:avoid;}
    .doc p{orphans:3; widows:3;}
  }
  @media screen{ .fixed-hd,.fixed-ft,.spacer-hd,.spacer-ft{display:none;} table.frame{width:100%; border-collapse:collapse; table-layout:fixed;} .body-sheet{overflow:hidden;} .doc span{overflow-wrap:anywhere;} }
</style>

<script>
(function(){
  const P = window.PSSYCCO_PRICING;
  const cart = P.loadCart();
  let member = null; try { member = sessionStorage.getItem('pssycco.member'); } catch(e){}
  const q = P.quote(cart, member);
  const hasMem = !!q.membership;
  const ui = document.getElementById('ui-main');

  if (!q.lines.length && !hasMem){
    ui.innerHTML = '<h1>your contract.</h1><p class="empty">Your hand is empty. <a href="/shop/">Go back to the shop</a> and add a piece or a membership first.</p>';
    document.getElementById('preview-label').remove();
    return;
  }

  /* ---------- spanish helpers ---------- */
  const U = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function w999(n){
    if (n===0) return ''; if (n===100) return 'cien';
    const c = Math.floor(n/100), r = n%100; let s = C[c];
    if (r){ s += (s?' ':'') + (r<30 ? U[r] : D[Math.floor(r/10)] + (r%10 ? ' y ' + U[r%10] : '')); }
    return s;
  }
  function words(n){
    n = Math.round(n); if (n===0) return 'cero';
    const mm = Math.floor(n/1e6), th = Math.floor((n%1e6)/1000), un = n%1000; let s = [];
    if (mm) s.push(mm===1 ? 'un millón' : w999(mm).replace(/uno$/,'un') + ' millones');
    if (th) s.push(th===1 ? 'mil' : w999(th).replace(/uno$/,'un') + ' mil');
    if (un) s.push(w999(un));
    return s.join(' ');
  }
  function pesos(n){ const w = words(n); return w + ((/millón$|millones$/.test(w)) ? ' de pesos' : ' pesos') + ' colombianos (COP ' + P.cop(n) + ')'; }
  function cnt(n){ return words(n).replace(/^uno$/,'uno') + ' (' + n + ')'; }
  const ORD = ['PRIMERA','SEGUNDA','TERCERA','CUARTA','QUINTA','SEXTA','SÉPTIMA','OCTAVA','NOVENA','DÉCIMA','DÉCIMA PRIMERA','DÉCIMA SEGUNDA','DÉCIMA TERCERA','DÉCIMA CUARTA','DÉCIMA QUINTA','DÉCIMA SEXTA','DÉCIMA SÉPTIMA','DÉCIMA OCTAVA','DÉCIMA NOVENA','VIGÉSIMA'];
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fecha(d){ return d.getDate() + ' de ' + MES[d.getMonth()] + ' de ' + d.getFullYear(); }
  function addMonths(d, m){ const x = new Date(d); x.setMonth(x.getMonth()+m); return x; }
  function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const pname = s => s.split(' ').map(w => /^(ai|non-ai|3d)$/i.test(w) ? w.toUpperCase().replace('NON-AI','Non-AI') : cap(w)).join(' ');

  /* ---------- the form ---------- */
  const today = new Date();
  const start0 = new Date(today.getFullYear(), today.getMonth()+1, 15);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const st = { kind:'empresa', name:'', idType:'NIT', idNum:'', city:'', country:'Colombia', rep:'', repId:'', email:'', start:iso(start0) };
  try { Object.assign(st, JSON.parse(localStorage.getItem('pssycco.client') || '{}')); } catch(e){}

  const title = hasMem ? q.membership.plan.name + ' membership' : 'pssycco bundle';
  ui.innerHTML = `
    <h1>your contract.</h1>
    <p class="lead">Fill in who is signing. Your contract is written as you type, below — when it looks right, download it as a PDF.</p>
    <form id="f" autocomplete="on" onsubmit="return false">
      <div class="f full"><label>the client is</label>
        <div class="seg" id="kind"><button type="button" data-k="empresa">a company</button><button type="button" data-k="persona">a person</button></div></div>
      <div class="f full"><label for="name" id="name-l">legal name of the company</label><input id="name" name="organization" required></div>
      <div class="f"><label for="idType">id type</label><select id="idType"><option>NIT</option><option>EIN</option><option>C.C.</option><option>C.E.</option><option>Pasaporte</option><option>Tax ID</option></select></div>
      <div class="f"><label for="idNum">id number</label><input id="idNum" inputmode="text"></div>
      <div class="f"><label for="city">city</label><input id="city" name="address-level2"></div>
      <div class="f"><label for="country">country</label><input id="country" name="country-name"></div>
      <div class="f rep"><label for="rep">legal representative</label><input id="rep" name="name"></div>
      <div class="f rep"><label for="repId">representative’s id (C.C. / passport)</label><input id="repId"></div>
      <div class="f"><label for="email">email</label><input id="email" type="email" name="email"></div>
      <div class="f"><label for="start">start date</label><input id="start" type="date"></div>
      <div class="actions">
        <button class="dl" type="button" id="dl">download contract (pdf)</button>
        <small>Your browser opens its print window — choose “Save as PDF”. Signed copies go to mossaicco@gmail.com.</small>
      </div>
    </form>`;
  const $ = id => document.getElementById(id);
  ['name','idType','idNum','city','country','rep','repId','email','start'].forEach(k=>{
    $(k).value = st[k] || ''; $(k).addEventListener('input', ()=>{ st[k] = $(k).value; save(); draw(); });
  });
  function syncKind(){
    document.querySelectorAll('#kind button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===st.kind));
    $('name-l').textContent = st.kind==='empresa' ? 'legal name of the company' : 'full name';
    document.querySelectorAll('.f.rep').forEach(el=>el.style.display = st.kind==='empresa' ? '' : 'none');
  }
  document.querySelectorAll('#kind button').forEach(b=>b.addEventListener('click', ()=>{
    st.kind = b.dataset.k; if (st.kind==='persona' && st.idType==='NIT'){ st.idType='C.C.'; $('idType').value='C.C.'; }
    save(); syncKind(); draw();
  }));
  function save(){ try { localStorage.setItem('pssycco.client', JSON.stringify(st)); } catch(e){} }
  syncKind();

  /* ---------- the document ---------- */
  const glyphs = ['brandfilm','short','clip','photostudio','signature'].map(k=>glyphSVG(k,'g')).join('');
  const tierHTML = hasMem ? `${q.membership.plan.name} <b>membership</b>` : `pssycco <b>bundle</b>`;
  const header = `<div class="page-hd"><div class="glyphs">${glyphs}</div><div class="tier">${tierHTML}</div></div>`;
  const footer = `<div class="page-ft">a <b>mossaicco</b> company / kingdom of shapes</div>`;

  function clauses(){
    const c = []; let n = 0;
    const H = t => `<h2>CLÁUSULA ${ORD[n++]} – ${t}</h2>`;
    const ref = {}; // clause numbers for cross references
    const blank = v => v ? esc(v) : '<span style="color:#b9b9b9">__________</span>';
    const clientName = st.name ? esc(st.name) : '<span style="color:#b9b9b9">[nombre del contratante]</span>';
    const start = st.start ? new Date(st.start + 'T12:00:00') : start0;
    const m = q.membership, months = m ? m.term.months : 0;
    const planLabel = m ? `"${cap(m.plan.name)} Pssycco Membership"` : '';

    // pre-compute clause order so cross references are right
    const order = ['objeto','duracion','cesion','valor','filosofia'];
    if (m) order.push('ensamble');
    order.push('entregables'); if (m) order.push('archivo');
    order.push('oblContratista','oblContratante','independencia','pi','confidencialidad');
    if (m && m.key !== 'leaders') order.push('ainonai');
    order.push('terminacion','ley','conflictos','suscripcion');
    order.forEach((k,i)=>ref[k] = ORD[i].charAt(0) + ORD[i].slice(1).toLowerCase());
    const R = k => 'Cláusula ' + ref[k].replace(/(\s)(\w)/g,(a,b,c)=>b+c.toUpperCase());
    const ClTitle = {
      objeto:'OBJETO DEL CONTRATO', duracion:'DURACIÓN', cesion:'CESIÓN ANTICIPADA DEL CONTRATO A PERSONA JURÍDICA',
      valor:'VALOR Y CONDICIONES COMERCIALES', filosofia:'FILOSOFÍA Y PROMESA DE MARCA', ensamble:'MES DE ENSAMBLE',
      entregables:'ENTREGABLES', archivo:'ARCHIVO CREATIVO DE MARCA', oblContratista:'OBLIGACIONES DEL CONTRATISTA',
      oblContratante:'OBLIGACIONES DEL CONTRATANTE', independencia:'INDEPENDENCIA Y AUTONOMÍA', pi:'PROPIEDAD INTELECTUAL',
      confidencialidad:'CONFIDENCIALIDAD', ainonai:'CONTENIDO AI Y NON-AI', terminacion:'TERMINACIÓN',
      ley:'LEY APLICABLE', conflictos:'SOLUCIÓN DE CONFLICTOS', suscripcion:'SUSCRIPCIÓN'
    };

    // parties
    let contratante;
    if (st.kind==='empresa'){
      contratante = `<p><b>CONTRATANTE:</b> ${clientName}, sociedad legalmente constituida conforme a las leyes de ${blank(st.country)}, identificada con ${esc(st.idType)} ${blank(st.idNum)}, domiciliada en ${blank(st.city)}, ${blank(st.country)}${st.rep ? `, representada legalmente por ${esc(st.rep)}${st.repId ? ', identificado con ' + esc(st.repId) : ''}` : ''}, en adelante denominada "EL CONTRATANTE".</p>`;
    } else {
      contratante = `<p><b>CONTRATANTE:</b> ${clientName}, identificado con ${esc(st.idType)} N.° ${blank(st.idNum)}, domiciliado en ${blank(st.city)}, ${blank(st.country)}, en adelante denominado "EL CONTRATANTE".</p>`;
    }
    const objetoLine = m
      ? `en virtud de la contratación por parte de EL CONTRATANTE de la membresía denominada <span style="font-size:9.6pt">${planLabel}</span>${q.lines.length ? ', junto con los productos adicionales detallados en la ' + R('entregables') : ''}`
      : `en virtud de la contratación por parte de EL CONTRATANTE de los productos detallados en la ${R('entregables')}`;
    c.push(`<h2 style="margin-top:6pt">PARTES CONTRATANTES</h2>
      ${contratante}
      <p><b>CONTRATISTA:</b> MATEO VASQUEZ ARISTIZABAL, en nombre de PSSYCCO AI Studios, en adelante denominado "EL CONTRATISTA".</p>
      <p>Las partes anteriormente descritas, obrando en sus propias calidades, acuerdan celebrar el presente Contrato de Prestación de Servicios, ${objetoLine}, el cual se regirá por las siguientes cláusulas:</p>`);

    order.forEach(k=>{
      let h = H(ClTitle[k]);
      switch(k){
      case 'objeto':

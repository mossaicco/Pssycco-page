<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>your workspace — pssycco</title>
<style>
  :root{
    --bg:#f4f2ec; --bg2:#ece8df; --ink:#4b4d45; --deep:#33352f;
    --muted:#9a9d90; --line:rgba(51,53,47,0.12);
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); min-height:100vh;}
  body{
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a{color:inherit;}
  img{display:block; max-width:100%;}

  nav.topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5%; background:rgba(244,242,236,0.9); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.06em;
  }
  nav.topnav .brand-logo{height:20px; width:auto; display:block;}
  nav.topnav .right{display:flex; align-items:center; gap:20px;}
  nav.topnav .user-email{color:var(--muted); font-size:12px;}
  nav.topnav button.signout{
    border:1px solid var(--ink); color:var(--ink); background:transparent;
    padding:8px 16px; font-size:11.5px; letter-spacing:0.06em; text-transform:lowercase;
    cursor:pointer; font-family:var(--sans); transition:.2s;
  }
  nav.topnav button.signout:hover{background:var(--ink); color:var(--bg);}

  main{flex:1; padding:70px 6% 60px;}
  .wrap{max-width:1100px; margin:0 auto;}

  .kicker{font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:16px;}
  h2{font-weight:400; text-transform:lowercase; line-height:1.15; letter-spacing:-0.01em; font-size:clamp(26px,4vw,38px);}
  p{font-size:15px; line-height:1.8; color:var(--ink);}
  p.muted{color:var(--muted);}

  .fade{opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s ease;}
  .fade.in{opacity:1; transform:translateY(0);}

  .empty-state{
    margin-top:34px; border:1px solid var(--line); padding:50px 40px; text-align:center;
    background:var(--bg2);
  }


  /* ---- drive explorer ---- */
  .breadcrumb{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:34px; margin-bottom:18px;}
  .breadcrumb .crumb{cursor:pointer; text-decoration:underline; text-transform:lowercase;}
  .breadcrumb .crumb:last-child{color:var(--ink); text-decoration:none; cursor:default;}
  .breadcrumb .sep{color:var(--muted);}

  .drive-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px;}
  .drive-card{
    border:1px solid var(--line); background:var(--bg2); padding:16px 12px; cursor:pointer;
    transition:.2s; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
  }
  .drive-card:hover{border-color:var(--ink);}
  .drive-thumb-wrap{
    width:100%; height:90px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:var(--bg); color:var(--muted);
  }
  .drive-thumb-wrap img{width:100%; height:100%; object-fit:cover;}
  .drive-icon{color:var(--muted); display:flex; align-items:center; justify-content:center;}
  .drive-name{font-size:12px; line-height:1.35; color:var(--ink); word-break:break-word;}

  .drive-empty, .drive-error{margin-top:10px; text-align:center; color:var(--muted); font-size:13.5px; padding:40px 0;}
  .drive-error{color:#a35447;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,21,18,0.92); display:none;
    align-items:center; justify-content:center; z-index:999; padding:2vh 2vw;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--bg); width:96vw; height:94vh; display:flex;
    flex-direction:column; position:relative; box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }
  .modal-close, .modal-fullscreen{
    position:absolute; top:10px; background:rgba(20,21,18,0.55); border:none; color:#fff;
    cursor:pointer; z-index:4; border-radius:50%; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1;
    transition:.2s;
  }
  .modal-close{right:10px; font-size:22px;}
  .modal-fullscreen{right:58px; font-size:16px;}
  .modal-close:hover, .modal-fullscreen:hover{background:rgba(20,21,18,0.85);}

  .modal-nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:4;
    background:rgba(20,21,18,0.45); border:none; color:#fff; width:52px; height:52px;
    border-radius:50%; font-size:28px; cursor:pointer; display:none; align-items:center; justify-content:center;
    transition:.2s; line-height:1; padding:0 0 3px;
  }
  .modal-nav:hover{background:rgba(20,21,18,0.8);}
  .modal-nav.prev{left:12px;}
  .modal-nav.next{right:12px;}

  .modal-name{padding:14px 100px 0 16px; font-size:13px; color:var(--muted); word-break:break-word;}
  .modal-frame{flex:1; min-height:0; background:#000; margin-top:12px;}
  .modal-frame iframe{width:100%; height:100%; border:none; display:block;}
  .modal-actions{padding:16px 20px; border-top:1px solid var(--line); text-align:center;}
  .btn{
    display:inline-block; border:1px solid var(--ink); color:var(--ink);
    padding:12px 28px; text-align:center; text-decoration:none; letter-spacing:0.08em;
    text-transform:lowercase; font-size:13px; transition:.25s; cursor:pointer;
    background:transparent; font-family:var(--sans);
  }
  .btn.solid{background:var(--ink); color:var(--bg);}
  .btn.solid:hover{background:var(--deep);}

  .modal-box:fullscreen{width:100vw; height:100vh; background:#000;}
  .modal-box:-webkit-full-screen{width:100vw; height:100vh; background:#000;}

  @media (max-width:600px){
    .modal-overlay{padding:1vh 1vw;}
    .modal-box{width:98vw; height:96vh;}
    .modal-nav{width:44px; height:44px; font-size:22px;}
    .modal-nav.prev{left:6px;}
    .modal-nav.next{right:6px;}
    .modal-close, .modal-fullscreen{width:36px; height:36px;}
    .modal-fullscreen{right:50px;}
  }

  /* ---- entry logo (fades out here, arriving already visible from index.html) ---- */
  .entry-overlay{
    position:fixed; inset:0; z-index:1100; background:var(--bg);
    display:none; align-items:center; justify-content:center;
  }
  .entry-overlay.show{display:flex;}
  .entry-overlay img{width:100%; height:100%; object-fit:cover; display:block;}
  .entry-overlay.fade-out img{animation: entry-fade-out 1400ms ease-in-out forwards;}
  @keyframes entry-fade-out{
    0%{opacity:1;}
    100%{opacity:0;}
  }

  footer{padding:34px 5% 40px; text-align:center; border-top:1px solid var(--line); margin-top:auto;}
  .signature{font-size:12px; letter-spacing:0.05em; color:var(--muted); text-transform:lowercase;}
</style>

<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>

<div class="entry-overlay" id="entry-overlay">
  <img id="entry-overlay-img" alt="">
</div>
<script>
  (function(){
    var url = sessionStorage.getItem('entryLogoUrl');
    if(url){
      sessionStorage.removeItem('entryLogoUrl');
      var overlay = document.getElementById('entry-overlay');
      document.getElementById('entry-overlay-img').src = url;
      overlay.classList.add('show');
      setTimeout(function(){
        overlay.classList.add('fade-out');
        setTimeout(function(){ overlay.style.display = 'none'; }, 1450);
      }, 500);
    }
  })();
</script>

<nav class="topnav">
  <img class="brand-logo" src="../assets/logo_glyph.png" alt="pssycco">
  <div class="right">
    <span class="user-email" id="user-email"></span>
    <button class="signout" id="signout">sign out</button>
  </div>
</nav>

<main>
  <div class="wrap fade" id="wrap">
    <div class="kicker" id="kicker">your workspace</div>
    <h2 id="heading">loading your drive…</h2>
    <p class="muted" id="subtext" style="margin-top:10px;"></p>

    <div id="drive-slot"></div>
  </div>
</main>

<!-- ===================================================================
     Uses the same Firebase project as members/index.html — the config
     below must match. Reads members/{email} from Firestore for the
     member's display name, brand logo, and assigned Google Drive root
     folder id, then browses that folder in-page via the Google Drive
     API (public, "anyone with the link" access only — no OAuth needed
     for read/preview/download of files shared that way).
     =================================================================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClZ8vQRjpavUCovCKkm7G2TKlDtu-ROo8",
    authDomain: "pietra-41149.firebaseapp.com",
    projectId: "pietra-41149",
    storageBucket: "pietra-41149.firebasestorage.app",
    messagingSenderId: "965119942981",
    appId: "1:965119942981:web:b72072ed543fe3282f5e2c"
  };

  // Separate key, restricted to the Google Drive API + pssycco.com referrer.
  const DRIVE_API_KEY = "AIzaSyDAs-zLIFdtnOZloI75INw7XiqOJiWwmqA";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const kicker = document.getElementById('kicker');
  const heading = document.getElementById('heading');
  const subtext = document.getElementById('subtext');
  const slot = document.getElementById('drive-slot');
  const userEmailEl = document.getElementById('user-email');

  let pathStack = []; // [{id, name}]
  let currentPreviewFiles = [];
  let currentPreviewIndex = -1;
  const FOLDER_MIME = 'application/vnd.google-apps.folder';

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  const FOLDER_SVG = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 6.5a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-11z"/></svg>';
  const FILE_SVG = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M15 2v5h5"/></svg>';

  async function driveGet(path, params){
    const usp = new URLSearchParams(params || {});
    usp.set('key', DRIVE_API_KEY);
    const res = await fetch('https://www.googleapis.com/drive/v3/' + path + '?' + usp.toString());
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error('drive api error ' + res.status + ' ' + body);
    }
    return res.json();
  }

  async function getFolderName(id){
    try{
      const data = await driveGet('files/' + encodeURIComponent(id), { fields: 'name' });
      return data.name || 'your drive';
    }catch(err){
      return 'your drive';
    }
  }

  async function fetchChildren(folderId){
    const data = await driveGet('files', {
      q: "'" + folderId + "' in parents and trashed = false",
      fields: 'files(id,name,mimeType,thumbnailLink,iconLink,webContentLink)',
      orderBy: 'folder,name',
      pageSize: '1000'
    });
    return data.files || [];
  }

  function renderBreadcrumb(){
    const container = document.createElement('div');
    container.className = 'breadcrumb';
    pathStack.forEach((p, i)=>{
      if(i > 0){
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '/';
        container.appendChild(sep);
      }
      const crumb = document.createElement('span');
      crumb.className = 'crumb';
      crumb.textContent = p.name;
      if(i < pathStack.length - 1){
        crumb.addEventListener('click', ()=>{
          pathStack = pathStack.slice(0, i + 1);
          renderExplorer();
        });
      }
      container.appendChild(crumb);
    });
    return container;
  }

  function openPreview(file){
    const frame = document.getElementById('modal-frame');
    const name = document.getElementById('modal-name');
    const dl = document.getElementById('modal-download');
    name.textContent = file.name;
    frame.innerHTML = '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(file.id) + '/preview" allow="autoplay; fullscreen"></iframe>';
    dl.href = file.webContentLink || ('https://drive.google.com/uc?export=download&id=' + encodeURIComponent(file.id));
  }

  function updateNavVisibility(){
    const showNav = currentPreviewFiles.length > 1;
    document.getElementById('modal-prev').style.display = showNav ? 'flex' : 'none';
    document.getElementById('modal-next').style.display = showNav ? 'flex' : 'none';
  }

  function openPreviewByIndex(idx){
    if(idx < 0 || idx >= currentPreviewFiles.length) return;
    currentPreviewIndex = idx;
    openPreview(currentPreviewFiles[idx]);
    document.getElementById('modal-overlay').classList.add('open');
    updateNavVisibility();
  }

  function navigatePreview(delta){
    if(currentPreviewFiles.length < 2) return;
    const n = currentPreviewFiles.length;
    openPreviewByIndex((currentPreviewIndex + delta + n) % n);
  }

  function closePreview(){
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-frame').innerHTML = '';
    currentPreviewIndex = -1;
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    }
  }

  function toggleFullscreen(){
    const box = document.getElementById('modal-box');
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (box.requestFullscreen || box.webkitRequestFullscreen)?.call(box);
    }else{
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    }
  }

  document.getElementById('modal-close').addEventListener('click', closePreview);
  document.getElementById('modal-fullscreen').addEventListener('click', toggleFullscreen);
  document.getElementById('modal-prev').addEventListener('click', ()=> navigatePreview(-1));
  document.getElementById('modal-next').addEventListener('click', ()=> navigatePreview(1));
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'modal-overlay') closePreview();
  });

  document.addEventListener('keydown', (e)=>{
    if(!document.getElementById('modal-overlay').classList.contains('open')) return;
    if(e.key === 'ArrowLeft') navigatePreview(-1);
    else if(e.key === 'ArrowRight') navigatePreview(1);
    else if(e.key === 'Escape') closePreview();
  });

  let touchStartX = null;
  const modalFrameEl = document.getElementById('modal-frame');
  modalFrameEl.addEventListener('touchstart', (e)=>{
    touchStartX = e.changedTouches[0].clientX;
  }, { passive:true });
  modalFrameEl.addEventListener('touchend', (e)=>{
    if(touchStartX == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){
      if(dx < 0) navigatePreview(1); else navigatePreview(-1);
    }
    touchStartX = null;
  }, { passive:true });

  async function renderExplorer(){
    slot.innerHTML = '';
    slot.appendChild(renderBreadcrumb());

    const grid = document.createElement('div');
    grid.className = 'drive-grid';
    grid.innerHTML = '<p class="muted">loading…</p>';
    slot.appendChild(grid);

    const currentId = pathStack[pathStack.length - 1].id;
    try{
      const files = await fetchChildren(currentId);
      grid.innerHTML = '';
      currentPreviewFiles = files.filter(f => f.mimeType !== FOLDER_MIME);
      if(files.length === 0){
        const empty = document.createElement('div');
        empty.className = 'drive-empty';
        empty.textContent = 'this folder is empty.';
        slot.appendChild(empty);
        return;
      }
      files.forEach(f=>{
        const isFolder = f.mimeType === 'application/vnd.google-apps.folder';
        const card = document.createElement('div');
        card.className = 'drive-card';

        if(isFolder){
          card.innerHTML = '<div class="drive-icon">' + FOLDER_SVG + '</div><div class="drive-name">' + escapeHtml(f.name) + '</div>';
          card.addEventListener('click', ()=>{
            pathStack.push({ id: f.id, name: f.name });
            renderExplorer();
          });
        }else{
          const thumb = f.thumbnailLink || null;
          const thumbHtml = thumb
            ? '<img src="' + thumb.replace(/=s\d+$/, '=s400') + '" loading="lazy" alt="">'
            : '<div class="drive-icon">' + FILE_SVG + '</div>';
          card.innerHTML = '<div class="drive-thumb-wrap">' + thumbHtml + '</div><div class="drive-name">' + escapeHtml(f.name) + '</div>';
          card.addEventListener('click', ()=> openPreviewByIndex(currentPreviewFiles.findIndex(x=>x.id===f.id)));
        }
        grid.appendChild(card);
      });
    }catch(err){
      grid.innerHTML = '';
      const errEl = document.createElement('div');
      errEl.className = 'drive-error';
      errEl.textContent = "couldn't load this folder. please refresh, or reach out if this keeps happening.";
      slot.appendChild(errEl);
    }
  }

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      window.location.href = "index.html";
      return;
    }
    userEmailEl.textContent = user.email;
    document.getElementById('wrap').classList.add('in');

    try{
      const snap = await getDoc(doc(db, "members", user.email.toLowerCase()));
      const data = snap.exists() ? snap.data() : null;
      const folderId = data && data.driveFolderId;
      const displayName = (data && data.displayName) ? data.displayName : user.email.split('@')[0];

      kicker.textContent = displayName + "’s workspace";
      heading.textContent = "welcome to your brand's ecosystem.";

      if(folderId){
        subtext.textContent = "explore, preview, or download your brand's assets.";
        const rootName = await getFolderName(folderId);
        pathStack = [{ id: folderId, name: rootName }];
        await renderExplorer();
      }else{
        subtext.textContent = "we're still connecting your drive folder — check back soon.";
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<p class="muted">once your folder is linked on our end, it will appear here automatically.</p>';
        slot.appendChild(empty);
      }
    }catch(err){
      heading.textContent = "couldn't load your workspace.";
      subtext.textContent = "please refresh, or reach out if this keeps happening.";
    }
  });

  document.getElementById('signout').addEventListener('click', async ()=>{
    await signOut(auth);
    window.location.href = "index.html";
  });
</script>

</body>
</html>

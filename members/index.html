<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>members — pssycco</title>
<style>
  :root{
    --bg:#f4f2ec; --bg2:#ece8df; --ink:#4b4d45; --deep:#33352f;
    --muted:#9a9d90; --line:rgba(51,53,47,0.12);
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); min-height:100vh;}
  body{
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a{color:inherit;}
  img{display:block; max-width:100%;}
  ::selection{background:var(--ink); color:var(--bg);}

  nav.topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5%; background:rgba(244,242,236,0.9); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.06em;
  }
  nav.topnav .brand-logo{height:20px; width:auto; display:block;}
  nav.topnav a.back{text-decoration:none; color:var(--muted); text-transform:lowercase;}
  nav.topnav a.back:hover{color:var(--ink);}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:80px 6%;}

  .kicker{font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; text-align:center;}
  h1{font-weight:400; text-transform:lowercase; line-height:1.15; letter-spacing:-0.01em; font-size:clamp(28px,4.5vw,40px); text-align:center;}
  p{font-size:14.5px; line-height:1.7; color:var(--ink);}

  .fade{opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s ease;}
  .fade.in{opacity:1; transform:translateY(0);}

  .auth-card{
    width:100%; max-width:420px; background:var(--bg); border:1px solid var(--line);
    padding:44px 38px; box-shadow:0 24px 60px rgba(51,53,47,0.08);
  }

  .tabs{display:flex; justify-content:center; gap:8px; margin:28px 0 30px;}
  .tab{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    padding:9px 20px; font-size:12px; letter-spacing:0.05em; text-transform:lowercase;
    cursor:pointer; transition:.2s; font-family:var(--sans);
  }
  .tab.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  form{display:flex; flex-direction:column; gap:14px;}
  form.hidden{display:none;}
  label{font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block;}
  input{
    width:100%; padding:12px 14px; border:1px solid var(--line); background:var(--bg2);
    color:var(--ink); font-family:var(--sans); font-size:14.5px; outline:none; transition:.2s;
  }
  input:focus{border-color:var(--ink);}
  .field{display:flex; flex-direction:column;}

  .btn{
    display:inline-block; border:1px solid var(--ink); color:var(--ink);
    padding:14px 0; text-align:center; text-decoration:none; letter-spacing:0.08em;
    text-transform:lowercase; font-size:13px; transition:.25s; cursor:pointer;
    background:transparent; font-family:var(--sans); width:100%; margin-top:6px;
  }
  .btn.solid{background:var(--ink); color:var(--bg);}
  .btn.solid:hover{background:var(--deep);}
  .btn:disabled{opacity:0.5; cursor:default;}

  .msg{font-size:13px; min-height:18px; text-align:center;}
  .msg.error{color:#a35447;}
  .msg.ok{color:#5c7a4d;}

  .switch-hint{text-align:center; font-size:12.5px; color:var(--muted); margin-top:20px;}
  .switch-hint button{
    background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer;
    font-family:var(--sans); font-size:12.5px; padding:0;
  }

  /* ---- entry logo (brand-specific fade-in, continues fading out on dashboard.html) ---- */
  .entry-overlay{
    position:fixed; inset:0; z-index:1100; background:var(--bg);
    display:none; align-items:center; justify-content:center;
  }
  .entry-overlay.show{display:flex;}
  .entry-overlay img{
    width:100%; height:100%; object-fit:cover; display:block; opacity:0;
    animation: entry-fade-in 1400ms ease-in-out forwards;
  }
  @keyframes entry-fade-in{
    0%{opacity:0;}
    100%{opacity:1;}
  }
  /* ---- default "thinker" — mossaicco / ai studios' own loading animation, used when a member
     hasn't uploaded a custom brand logo. its own background already matches the page (--bg),
     so it reads as transparent without needing real alpha ---- */
  .entry-overlay video{
    width:min(60vw, 420px); height:min(60vw, 420px); object-fit:contain; display:block;
    margin:0 auto; opacity:0; animation: entry-fade-in 500ms ease-in-out forwards;
  }

  footer{padding:34px 5% 40px; text-align:center; border-top:1px solid var(--line);}
  .signature{font-size:12px; letter-spacing:0.05em; color:var(--muted); text-transform:lowercase;}
</style>
</head>
<body>

<nav class="topnav">
  <img class="brand-logo" src="../assets/logo_glyph.png" alt="pssycco">
  <a class="back" href="../index.html">← pssycco.com</a>
</nav>

<main>
  <div class="auth-card fade" id="card">
    <div class="kicker">members</div>
    <h1 id="heading">welcome back.</h1>

    <div class="tabs">
      <button class="tab active" id="tab-signin" type="button">sign in</button>
      <button class="tab" id="tab-signup" type="button">sign up</button>
    </div>

    <form id="form-signin">
      <div class="field">
        <label for="si-email">email</label>
        <input id="si-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="si-pass">password</label>
        <input id="si-pass" type="password" autocomplete="current-password" required>
      </div>
      <div class="msg" id="si-msg"></div>
      <button class="btn solid" type="submit">sign in</button>
    </form>

    <form id="form-signup" class="hidden">
      <div class="field">
        <label for="su-code">secret code</label>
        <input id="su-code" type="text" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="su-email">email</label>
        <input id="su-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="su-pass">password</label>
        <input id="su-pass" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="su-pass2">confirm password</label>
        <input id="su-pass2" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="msg" id="su-msg"></div>
      <button class="btn solid" type="submit">create account</button>
    </form>

    <div class="switch-hint" id="hint-signin">
      don't have an account? <button type="button" id="go-signup">sign up</button>
    </div>
    <div class="switch-hint hidden" id="hint-signup">
      already a member? <button type="button" id="go-signin">sign in</button>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClZ8vQRjpavUCovCKkm7G2TKlDtu-ROo8",
    authDomain: "pietra-41149.firebaseapp.com",
    projectId: "pietra-41149",
    storageBucket: "pietra-41149.firebasestorage.app",
    messagingSenderId: "965119942981",
    appId: "1:965119942981:web:b72072ed543fe3282f5e2c"
  };

  const SECRET_CODE = "moderndesign";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  async function getMemberLogo(email){
    try{
      const snap = await getDoc(doc(db, "members", email));
      if(snap.exists() && snap.data().logoUrl) return snap.data().logoUrl;
    }catch(err){ /* no brand logo on file — proceed without the entry fade */ }
    return null;
  }

  function enterWithLogo(logoUrl, url){
    sessionStorage.setItem('entryLogoUrl', logoUrl);
    document.getElementById('card').style.display = 'none';
    const overlay = document.getElementById('entry-overlay');
    document.getElementById('entry-overlay-img').src = logoUrl;
    overlay.classList.add('show');
    setTimeout(()=>{ window.location.href = url; }, 1500);
  }

  // ---- default "thinker" — mossaicco / ai studios' own loading animation, used when a member
  // hasn't uploaded a custom brand logo. its own background already matches the page, so it
  // reads as transparent without needing real video alpha ----
  function enterWithDefaultVideo(url){
    document.getElementById('card').style.display = 'none';
    const overlay = document.getElementById('entry-overlay');
    const video = document.getElementById('entry-overlay-video');
    video.style.display = 'block';
    overlay.classList.add('show');
    let done = false;
    const go = ()=>{ if(done) return; done = true; window.location.href = url; };
    video.addEventListener('ended', go, {once:true});
    video.play().catch(()=>{});
    setTimeout(go, 2200); // safety net in case autoplay/ended doesn't fire
  }

  // if already signed in, skip straight to the dashboard
  onAuthStateChanged(auth, (user)=>{
    if(user) window.location.href = "dashboard.html";
  });

  document.getElementById('card').classList.add('in');

  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const formSignin = document.getElementById('form-signin');
  const formSignup = document.getElementById('form-signup');
  const hintSignin = document.getElementById('hint-signin');
  const hintSignup = document.getElementById('hint-signup');
  const heading = document.getElementById('heading');

  function showSignin(){
    tabSignin.classList.add('active'); tabSignup.classList.remove('active');
    formSignin.classList.remove('hidden'); formSignup.classList.add('hidden');
    hintSignin.classList.remove('hidden'); hintSignup.classList.add('hidden');
    heading.textContent = "welcome back.";
  }
  function showSignup(){
    tabSignup.classList.add('active'); tabSignin.classList.remove('active');
    formSignup.classList.remove('hidden'); formSignin.classList.add('hidden');
    hintSignup.classList.remove('hidden'); hintSignin.classList.add('hidden');
    heading.textContent = "join the studio.";
  }
  tabSignin.addEventListener('click', showSignin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('go-signup').addEventListener('click', showSignup);
  document.getElementById('go-signin').addEventListener('click', showSignin);

  function setMsg(el, text, kind){
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' '+kind : '');
  }

  function friendlyError(err){
    const code = err && err.code || '';
    if(code.includes('auth/invalid-email')) return 'that email doesn\'t look right.';
    if(code.includes('auth/invalid-credential') || code.includes('auth/wrong-password')) return 'incorrect email or password.';
    if(code.includes('auth/user-not-found')) return 'no account with that email yet.';
    if(code.includes('auth/email-already-in-use')) return 'that email is already registered — sign in instead.';
    if(code.includes('auth/weak-password')) return 'password should be at least 6 characters.';
    if(code.includes('auth/too-many-requests')) return 'too many attempts — try again in a moment.';
    return 'something went wrong. please try again.';
  }

  formSignin.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('si-msg');
    const email = document.getElementById('si-email').value.trim().toLowerCase();
    const pass = document.getElementById('si-pass').value;
    const btn = formSignin.querySelector('button');
    btn.disabled = true; setMsg(msg, 'signing in…');
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      setMsg(msg, '', 'ok');
      const logoUrl = await getMemberLogo(email);
      if(logoUrl){
        enterWithLogo(logoUrl, "dashboard.html");
      }else{
        enterWithDefaultVideo("dashboard.html");
      }
    }catch(err){
      setMsg(msg, friendlyError(err), 'error');
      btn.disabled = false;
    }
  });

  formSignup.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('su-msg');
    const code = document.getElementById('su-code').value.trim().toLowerCase();
    const email = document.getElementById('su-email').value.trim().toLowerCase();
    const pass = document.getElementById('su-pass').value;
    const pass2 = document.getElementById('su-pass2').value;
    const btn = formSignup.querySelector('button');

    if(code !== SECRET_CODE){
      setMsg(msg, 'that code isn\'t right.', 'error');
      return;
    }
    if(pass !== pass2){
      setMsg(msg, 'passwords don\'t match.', 'error');
      return;
    }

    btn.disabled = true; setMsg(msg, 'creating your account…');
    try{
      await createUserWithEmailAndPassword(auth, email, pass);
      setMsg(msg, '', 'ok');
      const logoUrl = await getMemberLogo(email);
      if(logoUrl){
        enterWithLogo(logoUrl, "dashboard.html");
      }else{
        enterWithDefaultVideo("dashboard.html");
      }
    }catch(err){
      setMsg(msg, friendlyError(err), 'error');
      btn.disabled = false;
    }
  });
</script>
